# ── Personal profile (light / Jetson) ─────────────────────────────────────────
# Select this profile by pointing RAG_CONFIG_PATH at this file, e.g.:
#   RAG_CONFIG_PATH=./config.personal.yaml .venv/bin/rag-index
#   RAG_CONFIG_PATH=./config.personal.yaml .venv/bin/rag-serve
# This is the "light" profile from the multi-corpus ADR (docs/ADR-multi-corpus-
# profiles-and-pluggable-store.md): the personal knowledge-base corpus (vault +
# Books/Resources), sized for the Jetson Orin Nano's 8 GB unified RAM. It is
# currently identical in content to config.yaml (the historical default) — the
# two files are kept in sync deliberately so config.yaml can later become a
# thin default/symlink-equivalent without behavior change. See
# docs/configuration.md#config-profiles for the full personal-vs-logmanager
# comparison.

# Canonical maintained checkout (the Google Drive copy at mindmap/Career Knowledge Base
# has a divergent, stale history — 1,042 vs 2,431 notes as of 2026-06-10; reconcile before
# ever pointing back at it).
vault_path: '/Users/turcinv/Documents/personal_knowledge/Career Knowledge Base/'
index_path: "./chroma_db"
log_path: "./logs/rag.log"   # app log file (rotating); override with RAG_LOG_PATH (set in Docker)

# Retrieval backend. Only "chroma" exists today; "opensearch" is a future
# backend for the Logmanager wiki (see the ADR, Axis 2). Default — does not
# change behavior.
store: chroma

# Collection name encodes the embedding model. Chunk IDs are sha256 of the chunk
# TEXT, not the embedding (see chunking.stable_id), so a model swap MUST use a
# fresh collection name or old vectors silently survive. bge-small-en-v1.5
# (obsidian_markdown_bge_small) and gte-small (obsidian_markdown_gte_small) were
# both tried and both net-regressed vs MiniLM on this corpus — see tests/eval/
# bge_small.json / gte_small.json vs baseline.json. MiniLM kept.
collection_name: "obsidian_markdown"

include_extensions:
  - ".md"

exclude_dirs:
  - ".obsidian"
  # Claude Code worktrees (.claude/worktrees/*) are near-full vault copies that
  # double-index every note; agent/skill meta under .claude is not knowledge.
  - ".claude"
  - ".trash"
  - "Resources/_catalog"
  # Auto-generated catalog stubs (214 Resource Notes, Books Index, Topic MOCs,
  # Learning Paths). Book/resource CONTENT is indexed in full via json_sources —
  # embedding these 146-word metadata stubs would only double-cover it with noise.
  - "Resources/Generated"
  - "Attachments"
  - "Archive"
  - "Templates"
  - ".git"

exclude_files:
  - ".DS_Store"
  - "CLAUDE.md"
  - "Dashboard.md"
  - "Home.md"
  - "README.md"

# Navigation indexes, not knowledge: domain MOCs are giant wikilink lists whose
# chunks match many queries spuriously ("title soup"). The link graph is already
# captured per-note in chunk metadata (wikilinks field).
exclude_filename_patterns:
  - "* MOC.md"

chunk_max_chars: 1200
chunk_overlap_chars: 150
embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
# Query-side instruction prefix (applied in query.py's search()/CLI, never to
# indexed passages). all-MiniLM needs NO prefix, so leave this empty. An
# asymmetric model like bge-small-en-v1.5 would set "Represent this sentence for
# searching relevant passages: " here.
query_instruction: ""

# Cross-encoder reranker (query-time only, no reindex). search()/rag-query
# retrieve rerank_fetch_k dense candidates, then reorder to the requested
# n_results with this model. The model is ~80 MB and, like the embedder,
# is fetched from HF at first use — it must be present in the Jetson HF cache
# for offline runs (it ships in the already-pinned sentence-transformers).
reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
rerank_fetch_k: 20
# Off by default on this corpus — measured 2026-07-27, reranking LOSES overall
# recall@5 (0.911 → 0.844): it reorders usefully inside top-5 but ejects some
# rank-1 vault hits entirely. Override per call with `rag-query --rerank` or
# `"rerank": true` in the request body. See CLAUDE.md roadmap item 5.
rerank_default: false
# Dense candidate-pool floor when a --tag filter is active. Tags are post-filtered
# (Chroma 0.6.3 can't query the comma-joined tags string), so the pool must be wide
# enough that matches survive the post-filter. Only applies when tags are supplied.
tag_fetch_k: 200

# BM25 hybrid (experimental, off by default; see config.yaml for the full note).
# Inert unless --hybrid is passed; hybrid=False stays byte-identical to dense-only.
hybrid_fetch_k: 50            # candidate-pool depth for BOTH pools when hybrid is on
hybrid_weights: [0.3, 1.0]    # [w_lexical, w_dense] — dense-favored (see config.yaml note)
hybrid_rrf_k: 60             # RRF damping constant

# Answer generation (optional layer above search(); see config.yaml for the full
# reference). DISABLED by default — /query works without it, /answer returns 503
# until a `generation` block + API key env var are present. On the Jetson the LLM
# call is remote (cloud API), so it adds no local memory beyond an httpx request.
# generation:
#   provider: anthropic
#   model: claude-sonnet-5
#   max_tokens: 1024
#   temperature: 0.0
#   api_key_env: ANTHROPIC_API_KEY

embedding_batch_size: 16   # chunks per embed call — keep small on Jetson (8 GB unified RAM)
markdown_workers: 1        # threads for parallel MD extraction (I/O bound); 1 = sequential
pdf_workers: 1             # threads for parallel PDF extraction; keep at 1 on Jetson
embedding_workers: 1       # CPU fallback workers (ignored when CUDA is available)

pdf_sources:
  - path: '/Users/turcinv/Documents/personal_knowledge/Books/'
    type: book
  - path: '/Users/turcinv/Documents/personal_knowledge/Resources/'
    type: resource

# Pre-extracted book/resource JSON (doc-text-extractor `indexed/*.json`): full
# text + enriched metadata (title, primary_topic, resource_type, tags, confidence).
# Deterministic input — always preferred over live PDF parsing. PDF sources act
# as a FALLBACK: any file whose name is covered by a JSON document is skipped
# automatically, so keeping both configured never double-indexes. New PDFs
# dropped into Books/ are picked up live until the extraction pipeline runs.
# Override with RAG_JSON_PATH (set automatically in Docker).
json_sources:
  - path: '~/Documents/knowledge-base-index/indexed'

# ── Extractor pipeline paths ──────────────────────────────────────────────────
# Used by the rag-extract / rag-enrich / rag-build-* CLI tools.
# Override individual paths with the matching env vars (RAG_BOOKS_PATH, etc.)
# when running in Docker — the Makefile extractor targets do this automatically.
extractor:
  # Source document directories (Books and Resources are the two input groups).
  books_path: '/Users/turcinv/Documents/personal_knowledge/Books'
  resources_path: '/Users/turcinv/Documents/personal_knowledge/Resources'

  # Catalog inventory files (read-only canonical inputs).
  catalog_path: '/Users/turcinv/Documents/personal_knowledge/Career Knowledge Base/Resources/_catalog'

  # Where extraction pipeline writes its heavy outputs (text JSONs, indexed
  # JSONs, SQLite DB). NOT committed to git — lives outside the vault.
  output_path: '~/Documents/knowledge-base-index'

  # Where build_obsidian_notes.py writes the per-resource Markdown stubs.
  obsidian_notes_path: '/Users/turcinv/Documents/personal_knowledge/Career Knowledge Base/Resources/Generated/Resource Notes'

  # Folder holding existing Topic MOC / Learning Path notes (for link_mocs.py
  # and build_obsidian_notes.py MOC resolution).
  mocs_path: '/Users/turcinv/Documents/personal_knowledge/Career Knowledge Base/Resources/Generated'
