[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-rag"
version = "0.2.0"
description = "Local semantic search over an Obsidian vault and PDF library (includes extraction pipeline)"
requires-python = ">=3.10"
# torch is intentionally excluded — install separately:
#   x86:    pip install torch==2.5.1
#   Jetson: pip install torch torchvision --index-url https://pypi.jetson-ai-lab.io/jp6/cu126
dependencies = [
    "chromadb==0.6.3",
    "sentence-transformers==3.3.1",
    "python-frontmatter==1.3.0",
    "PyYAML==6.0.3",
    "pypdf==6.12.2",
    "PyMuPDF>=1.24",
    "cryptography>=3.1",
    "python-pptx==1.0.2",
    "posthog==7.17.0",
    "python-dotenv==1.2.2",
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "pyjwt==2.13.0",
    "httpx==0.28.1",
    "mcp==2.0.0",
    "mcp-types==2.0.0",
]

[project.optional-dependencies]
dev = [
    "build==1.5.0",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.20",
]

[project.scripts]
rag-index = "rag.indexer:main"
rag-query = "rag.query:main"
rag-build-lexical = "rag.lexical:main"
rag-pipeline-status = "rag.pipeline_status:main"
rag-eval = "rag.eval:main"
rag-extract = "extractor.extract_text:main"
rag-analyze = "extractor.analyze_files:main"
rag-enrich = "extractor.enrich_metadata:main"
rag-build-index = "extractor.build_index_documents:main"
rag-build-notes = "extractor.build_obsidian_notes:main"
rag-build-books-index = "extractor.build_books_index:main"
rag-build-sqlite = "extractor.build_sqlite:main"
rag-build-vault-index = "extractor.build_vault_index:main"
rag-dup-detect = "extractor.dup_detect:main"
rag-link-mocs = "extractor.link_mocs:main"
rag-search = "extractor.search:main"
rag-stats = "rag.stats:main"
rag-config = "rag.config_cli:main"
rag-pipeline = "extractor.pipeline:main"
rag-sync-generation = "extractor.sync:main"
rag-backup = "rag.backup:main"
rag-serve = "rag.api.app:run"
rag-token = "rag.api.token:main"
rag-mcp = "rag.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["rag", "extractor"]

[tool.coverage.report]
fail_under = 40
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Start with correctness-only rules so linting is a useful gate without a
# repository-wide formatting rewrite. Broaden this set incrementally.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
# Lenient by design, mirroring the correctness-only ruff gate: check the
# annotations that exist and catch real type errors, but do NOT require every
# function to be annotated (check_untyped_defs stays off). Broaden incrementally.
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
