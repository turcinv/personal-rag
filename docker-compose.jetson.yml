# personal-rag — Jetson Orin Nano Super (JetPack 6.2, CUDA 12.6)
#
# Run ON the Jetson. Requires NVIDIA Container Toolkit.
#
# Usage:
#   docker compose -f docker-compose.jetson.yml run --rm rag python -m rag.indexer
#   docker compose -f docker-compose.jetson.yml run --rm rag python -m rag.query "your question"
#
# Or use the Makefile shortcuts:
#   make build-jetson
#   make jetson-index
#   make jetson-query Q="your question"

services:
  rag:
    build:
      context: .
      dockerfile: Dockerfile.jetson
    image: personal-rag:jetson
    runtime: nvidia
    volumes:
      - chroma:/data/chroma
      - hf-cache:/data/hf-cache
      - ./logs:/data/logs                          # app logs, readable on the host
      - ./tests/eval:/app/tests/eval               # persist eval output (make jetson-eval --out) to the host
      - ${RAG_VAULT_PATH:-/tmp}:/vault:ro
      - ${RAG_PDF_BOOKS_PATH:-/tmp}:/books:ro
      - ${RAG_PDF_RESOURCES_PATH:-/tmp}:/resources:ro
      - ${RAG_JSON_PATH:-/tmp}:/index:ro
      # Extractor pipeline: writable output directory for text_output/, indexed/, resources.db
      - ${RAG_OUTPUT_PATH:-/tmp}:/extractor-out
      # Catalog inputs and Obsidian-generated folder
      - ${RAG_CATALOG_PATH:-/tmp}:/catalog:ro
      - ${RAG_MOCS_PATH:-/tmp}:/mocs
    environment:
      RAG_VAULT_PATH: /vault
      RAG_PDF_BOOKS_PATH: /books
      RAG_PDF_RESOURCES_PATH: /resources
      RAG_JSON_PATH: /index
      RAG_INDEX_PATH: /data/chroma
      RAG_LOG_PATH: /data/logs/rag.log
      # Extractor pipeline env overrides
      RAG_BOOKS_PATH: /books
      RAG_RESOURCES_PATH: /resources
      RAG_CATALOG_PATH: /catalog
      RAG_OUTPUT_PATH: /extractor-out
      RAG_OBSIDIAN_NOTES_PATH: /mocs/Resource Notes
      RAG_MOCS_PATH: /mocs
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

  # HTTP backend (rag-serve). Same image + mounts as `rag`, so it reads the same
  # Chroma dir and config; the model/collection/reranker load once at startup.
  # One shared server process holds the model + reranker resident (8 GB budget).
  api:
    build:
      context: .
      dockerfile: Dockerfile.jetson
    image: personal-rag:jetson
    runtime: nvidia
    command: ["python", "-m", "rag.api.app"]
    ports:
      - "8000:8000"
    volumes:
      - chroma:/data/chroma
      - hf-cache:/data/hf-cache
      - ./logs:/data/logs                          # app logs, readable on the host
      - ./tests/eval:/app/tests/eval               # persist eval output (make jetson-eval --out) to the host
      - ${RAG_VAULT_PATH:-/tmp}:/vault:ro
      - ${RAG_PDF_BOOKS_PATH:-/tmp}:/books:ro
      - ${RAG_PDF_RESOURCES_PATH:-/tmp}:/resources:ro
      - ${RAG_JSON_PATH:-/tmp}:/index:ro
      # Extractor pipeline: writable output directory for text_output/, indexed/, resources.db
      - ${RAG_OUTPUT_PATH:-/tmp}:/extractor-out
      # Catalog inputs and Obsidian-generated folder
      - ${RAG_CATALOG_PATH:-/tmp}:/catalog:ro
      - ${RAG_MOCS_PATH:-/tmp}:/mocs
    environment:
      RAG_VAULT_PATH: /vault
      RAG_PDF_BOOKS_PATH: /books
      RAG_PDF_RESOURCES_PATH: /resources
      RAG_JSON_PATH: /index
      RAG_INDEX_PATH: /data/chroma
      RAG_LOG_PATH: /data/logs/rag.log
      # Extractor pipeline env overrides
      RAG_BOOKS_PATH: /books
      RAG_RESOURCES_PATH: /resources
      RAG_CATALOG_PATH: /catalog
      RAG_OUTPUT_PATH: /extractor-out
      RAG_OBSIDIAN_NOTES_PATH: /mocs/Resource Notes
      RAG_MOCS_PATH: /mocs
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # API: JWT secret passed through from the host .env; host/port have defaults.
      RAG_API_JWT_SECRET: ${RAG_API_JWT_SECRET:-}
      RAG_API_HOST: ${RAG_API_HOST:-0.0.0.0}
      RAG_API_PORT: ${RAG_API_PORT:-8000}

volumes:
  chroma:
  hf-cache:
