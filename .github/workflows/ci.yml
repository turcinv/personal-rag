name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python 3.10 to match Jetson JetPack 6.2 runtime and the pinned
      # requires-python = ">=3.10,<3.11" constraint in pyproject.toml.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
          pip install pytest

      - name: Run offline unit suite
        run: pytest tests/ -q
